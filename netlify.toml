[build]
  command = "yarn test:environment && yarn build"
  functions = "functions"
  publish = "dist"

[build.environment]
  # TypeScript compilation during build requires @types packages from devDependencies.
  YARN_FLAGS = "--production=false"

[functions.comment]
  included_files = ["moderation-terms.txt"]

[dev]
  framework = "#custom"
  command = "yarn run dev:frontend"
  targetPort = 5173
  port = 5000
  publish = "dist"
  autoLaunch = false
